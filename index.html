<title>MELLOY 캐릭터 작성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 휴대폰은 [목차] ↔ [칸 편집] 한 화면씩, 넓은 화면은 목차 | 편집 두 칸. 아래에는 글자 수 계기판이 늘 붙어 있음 */
:root {
  --bg: #f2f5f4; --surface: #ffffff; --sunken: #e8eeec; --ink: #17201e; --muted: #5a6a66; --line: #d6dfdc;
  --accent: #0d6b63; --accent-ink: #ffffff; --accent-soft: #dcefec;
  --ok: #1d7a3a; --warn: #a15f00; --fail: #b3242b; --warn-soft: #fbefdc; --fail-soft: #fbe3e3;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-display: "Gowun Batang", "AppleMyungjo", "Batang", serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1413; --surface: #151d1b; --sunken: #1b2523; --ink: #e2ebe8; --muted: #94a6a1; --line: #263330;
  --accent: #52c2b3; --accent-ink: #062320; --accent-soft: #173431;
  --ok: #5fc47c; --warn: #e3a54a; --fail: #f07b74; --warn-soft: #33281a; --fail-soft: #3a1f1f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #151d1b; --sunken: #1b2523; --ink: #e2ebe8; --muted: #94a6a1; --line: #263330;
  --accent: #52c2b3; --accent-ink: #062320; --accent-soft: #173431;
  --ok: #5fc47c; --warn: #e3a54a; --fail: #f07b74; --warn-soft: #33281a; --fail-soft: #3a1f1f; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 12.5px; letter-spacing: 0.01em; }

/* 위쪽 막대 */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.topbar h1 { margin: 0; font: 700 19px/1.2 var(--font-display); letter-spacing: -0.01em; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar h1 small { font: 500 12px var(--font-body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 500; font-size: 14px; }
.icon-btn[hidden] { display: none !important; }
@media (min-width: 900px) { #back-btn { display: none !important; } }

/* 본문 */
.shell { max-width: 1100px; margin: 0 auto; padding: 14px 16px 120px; display: grid; gap: 18px; }
@media (min-width: 900px) { .shell { grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
  .nav { position: sticky; top: 72px; max-height: calc(100vh - 170px); overflow: auto; } }
@media (max-width: 899px) { body[data-view="home"] .editor, body:not([data-view="home"]) .nav { display: none; } }

/* 목차 */
.draft { display: grid; gap: 6px; padding-block: 4px 10px; }
.draft-name { font: 700 24px/1.25 var(--font-display); text-wrap: balance; margin: 0; }
.draft-meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.quick-home { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick-home .primary { grid-column: 1 / -1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 9px 14px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 45%, var(--line)); }
.btn:disabled { opacity: 0.5; cursor: default; }
.part { margin-top: 14px; }
.part-title { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px 2px; }
.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.items li + li { border-top: 1px solid var(--line); }
.nav-item { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 11px 14px; background: none; border: 0; text-align: left; }
.nav-item[aria-current="true"] { background: var(--accent-soft); }
.nav-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .sub { display: block; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.fail { background: var(--fail); }

/* 칸 편집 */
.editor { min-width: 0; display: grid; gap: 12px; }
.ed-head { display: grid; gap: 2px; }
.ed-crumb { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
.ed-title { margin: 0; font: 700 22px/1.3 var(--font-display); text-wrap: balance; }
.guide { background: var(--sunken); border-radius: var(--radius); padding: 10px 14px; }
.guide summary { cursor: pointer; font-weight: 500; color: var(--muted); font-size: 14px; }
.guide pre { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.6 var(--font-body); color: var(--muted); }
.field { width: 100%; min-height: 46vh; resize: vertical; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 14px; line-height: 1.7; field-sizing: content; }
.field:focus { border-color: var(--accent); outline: none; }
.ed-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); }
.pager { display: flex; gap: 8px; }

/* 변수·로어북 카드 */
.group-title { margin: 10px 0 0; font-size: 15px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
.card-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.card-head .name-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
label.tag { display: grid; gap: 4px; }
.tag-name { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-data); font-size: 12.5px; color: var(--muted); }
.tag-name .over { color: var(--fail); font-weight: 500; }
.input, .area, select.input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.area { min-height: 72px; resize: vertical; line-height: 1.6; field-sizing: content; }
.input:focus, .area:focus { border-color: var(--accent); outline: none; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.confirm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--fail); font-size: 14px; }

/* 아래 계기판 */
.meter-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); }
body.typing .meter-bar { display: none; }
.meter-inner { max-width: 1100px; margin: 0 auto; }
.meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.meter { display: grid; gap: 3px; min-width: 0; }
.meter-label { display: flex; flex-wrap: wrap; justify-content: space-between; column-gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.meter-label b { color: var(--ink); font-weight: 500; }
.meter-label small { font-size: 11px; }
.meter-track { height: 5px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.meter-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
.meter.warn .meter-fill { background: var(--warn); } .meter.fail .meter-fill { background: var(--fail); }
.meter.warn .meter-label b, .meter.warn .meter-label span { color: var(--warn); }
.meter.fail .meter-label b, .meter.fail .meter-label span { color: var(--fail); }
.issues-btn { border: 0; border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 14px; background: var(--sunken); white-space: nowrap; }
.issues-btn.warn { background: var(--warn-soft); color: var(--warn); } .issues-btn.fail { background: var(--fail-soft); color: var(--fail); }
.issues-btn.ok { color: var(--ok); }

/* 아래에서 올라오는 창 */
.scrim { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, #000 40%, transparent); display: grid; align-items: end; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; margin: 0 auto; border-radius: 16px 16px 0 0; max-height: 86vh; overflow: auto;
  padding: 16px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.sheet h2 { margin: 0; font: 700 19px/1.3 var(--font-display); }
.sheet p { margin: 0; }
.sheet .muted, .muted { color: var(--muted); font-size: 13.5px; }
.menu-list { display: grid; gap: 2px; }
.menu-list button { text-align: left; background: none; border: 0; border-radius: 8px; padding: 11px 10px; display: grid; gap: 1px; }
.menu-list button:hover { background: var(--sunken); }
.menu-list button span { color: var(--muted); font-size: 13px; }
.menu-sep { height: 1px; background: var(--line); margin: 6px 0; }
.issue { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; display: grid; gap: 4px; }
.issue.warn { border-color: var(--warn); } .issue.fail { border-color: var(--fail); }
.issue-title { font-weight: 600; }
.issue.warn .issue-title { color: var(--warn); } .issue.fail .issue-title { color: var(--fail); }
.issue-detail { white-space: pre-wrap; word-break: break-word; color: var(--muted); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 13px; }
.paste-area { width: 100%; min-height: 40vh; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); }
.toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 600; margin-left: 8px; }
@media (prefers-reduced-motion: reduce) { .meter-fill { transition: none; } }
</style>

<header class="topbar"><div class="topbar-inner">
  <button class="icon-btn" id="back-btn" type="button" hidden>‹ 목차</button>
  <h1 id="top-title">MELLOY 캐릭터 작성기</h1>
  <button class="issues-btn" id="issues-btn" type="button">점검</button>
  <button class="icon-btn" id="menu-btn" type="button">메뉴</button>
</div></header>

<main class="shell">
  <nav class="nav" id="nav" aria-label="칸 목록"></nav>
  <section class="editor" id="editor" aria-live="polite"></section>
</main>

<footer class="meter-bar"><div class="meter-inner">
  <div class="meters" id="meters"></div>
</div></footer>

<div id="layer"></div>
<input type="file" id="file-source" accept=".txt,.md,text/plain,text/markdown" hidden>
<input type="file" id="file-template" accept=".md,.txt,text/plain,text/markdown" hidden>

      if (normalize(rule["필드"] || "") === normalize(field)) return [field, ...(rule["별칭"] || [])];
    return [field];
  }
  function matchingSections(sections, aliases) {
    if (!sections.length) return [];
    const top = Math.min(...sections.map((s) => s.level));
    const keys = aliases.filter(Boolean).map(normalize);
    return sections.filter((s) => s.level === top && keys.some((k) => normalize(s.name).startsWith(k)));
  }

  // ── 기계 점검 ──
  function checkLengths(sections, config) {
    const items = [];
    const ratio = Number(config["경고_비율"] ?? 0.9);
    const withSpaces = Boolean(config["공백_포함_글자수"] ?? true);
    const basis = withSpaces ? "공백 포함" : "공백 제외";
    for (const rule of config["글자수_제한"] || []) {
      const field = rule["필드"] ?? "?", limit = Math.trunc(Number(rule["최대"] ?? 0));
      const sec = findSection(sections, [field, ...(rule["별칭"] || [])]);
      if (!sec) { items.push(item(WARN, `'${field}' 필드를 찾지 못했습니다`, `헤더 이름을 확인해 주세요. (예: # ${field})`)); continue; }
      const n = countChars(sec.body, withSpaces);
      const msg = `${fmt(n)}자 / 최대 ${fmt(limit)}자 (${basis}) · ${sec.start - 1}번째 줄의 '${sec.name}'`;
      if (n > limit) items.push(item(FAIL, `'${field}' 필드 글자 수 초과 (+${fmt(n - limit)}자)`, msg));
      else if (n > limit * ratio) items.push(item(WARN, `'${field}' 필드 글자 수가 한도에 가깝습니다`, msg));
      else items.push(item(PASS, `'${field}' 필드 글자 수 정상`, msg));
    }
    return items;
  }

  function matchBraces(text) {
    const tokens = [...text.matchAll(/\{\{|\}\}/g)].map((m) => [m.index, m[0]]);
    const stack = [], matched = new Set(), stray = [];
    for (const [pos, tok] of tokens) {
      if (tok === "{{") stack.push(pos);
      else if (stack.length) matched.add(stack.pop());
      else stray.push(pos);
    }
    return { tokens, matched, unclosed: stack, stray };
  }
  function linePreview(text, pos, before = false) {
    let snippet;
    if (before) {
      const start = text.lastIndexOf("\n", pos - 1) + 1;
      snippet = Array.from(strip(text.slice(start, pos + 2)));
      snippet = snippet.length > 20 ? "..." + snippet.slice(-20).join("") : snippet.join("");
    } else {
      const end = text.indexOf("\n", pos);
      snippet = Array.from(strip(text.slice(pos, end >= 0 ? end : text.length)));
      snippet = snippet.length > 20 ? snippet.slice(0, 20).join("") + "..." : snippet.join("");
    }
    return `${lineOf(text, pos)}번째 줄 — ${snippet}`;
  }
  function checkUserVariable(text, sections, config) {
    const items = [];
    const all = [...text.matchAll(/\{\{\s*user\s*\}\}/gi)];
    const exact = all.filter((m) => m[0] === "{{user}}");
    const variants = all.filter((m) => m[0] !== "{{user}}");
    let problems = 0;
    const braces = matchBraces(text);

    if (config["user_중첩_금지"] ?? true) {
      const userStarts = new Set([...exact, ...variants].map((m) => m.index));
      const nested = [], stack = [];
      for (const [pos, tok] of braces.tokens) {
        if (tok === "{{") {
          if (userStarts.has(pos) && stack.some((p) => braces.matched.has(p))) nested.push(lineOf(text, pos));
          stack.push(pos);
        } else if (stack.length) stack.pop();
      }
      if (nested.length) {
        problems++;
        items.push(item(FAIL, "다른 변수 안에 {{user}}가 들어가 있습니다", `${fmtLines(nested)} — 변수 안에 변수를 넣으면 치환이 깨집니다.`));
      }
    }
    if (config["user_헤더_금지"] ?? true) {
      const hl = [];
      splitlines(text).forEach((l, i) => { if (MD_HEADER.test(l) && /\{\{\s*user\s*\}\}/i.test(l)) hl.push(i + 1); });
      if (hl.length) { problems++; items.push(item(FAIL, "섹션 제목(헤더)에 {{user}}가 들어가 있습니다", fmtLines(hl))); }
    }
    for (const forbidden of config["user_금지_섹션"] || []) {
      const sec = findSection(sections, [forbidden]);
      if (!sec || !/\{\{\s*user\s*\}\}/i.test(sec.body)) continue;
      problems++;
      const lines = all.map((m) => lineOf(text, m.index)).filter((ln) => sec.start <= ln && ln <= sec.end);
      items.push(item(FAIL, `'${forbidden}' 섹션에는 {{user}}를 쓸 수 없습니다`, `'${sec.name}' 섹션 · ${fmtLines(lines)}`));
    }
    const typo = variants.map((m) => lineOf(text, m.index));
    for (const m of text.matchAll(/\{\s*user\s*\}/gi)) {  // {user} (앞뒤 중괄호가 하나뿐인 것)
      if (text[m.index - 1] !== "{" && text[m.index + m[0].length] !== "}") typo.push(lineOf(text, m.index));
    }
    for (const m of text.matchAll(/\{\{\s*(유저|사용자)\s*\}\}/g)) typo.push(lineOf(text, m.index));
    if (typo.length) items.push(item(WARN, "{{user}} 표기가 정확하지 않은 곳이 있습니다", `${fmtLines(typo)} — 정확히 {{user}} (소문자, 공백 없음)로 써 주세요.`));

    if (braces.unclosed.length || braces.stray.length) {
      const opens = braces.tokens.filter(([, t]) => t === "{{").length;
      const lines = [`'{{' ${opens}개, '}}' ${braces.tokens.length - opens}개`];
      braces.unclosed.slice(0, 10).forEach((p) => lines.push(`닫히지 않은 '{{': ${linePreview(text, p)}`));
      braces.stray.slice(0, 10).forEach((p) => lines.push(`여는 짝이 없는 '}}': ${linePreview(text, p, true)}`));
      const extra = Math.max(0, braces.unclosed.length - 10) + Math.max(0, braces.stray.length - 10);
      if (extra) lines.push(`... 외 ${extra}곳`);
      items.push(item(WARN, "변수 괄호 짝이 맞지 않습니다", lines.join("\n")));
    }
    if (problems === 0) items.unshift(item(PASS, "금지된 위치에 {{user}}가 없습니다", `{{user}} 사용 횟수: 총 ${exact.length}회`));
    return items;
  }

  function checkTotalLength(sections, config) {
    const rule = config["합계_제한"];
    const fields = rule["대상_필드"] || [];
    const loreCap = Math.trunc(Number(rule["로어북_반영_상한"] ?? 3000));
    const recommended = Math.trunc(Number(rule["권장"] ?? 20000));
    const maximum = Math.trunc(Number(rule["최대"] ?? 30000));
    let total = 0;
    const parts = [], missing = [];
    for (const field of fields) {
      const found = matchingSections(sections, fieldAliases(field, config));
      const counts = found.map((s) => countChars(s.body, true));
      const actual = counts.reduce((a, b) => a + b, 0);
      if (!found.length) missing.push(field);
      const isLore = normalize(field) === normalize("로어북");
      const used = isLore ? Math.min(actual, loreCap) : actual;
      total += used;
      let t = `${field} ${fmt(used)}`;
      if (isLore && actual > loreCap) t += `(실제 ${fmt(actual)})`;
      if (found.length > 1) t += ` [${found.length}개 섹션: ` + counts.map(fmt).join(" + ") + "]";
      parts.push(t);
    }
    let detail = parts.join(" / ") + ` = ${fmt(total)}자 (공백 포함)\n권장 ${fmt(recommended)}자 / 최대 ${fmt(maximum)}자`;
    if (loreCap) detail += ` · 로어북은 최대 ${fmt(loreCap)}자까지만 반영`;
    if (missing.length) detail += "\n찾지 못한 섹션(0자로 계산): " + missing.map((m) => `'${m}'`).join(", ");
    const r = { total, recommended, maximum };
    if (total > maximum) return [Object.assign(item(FAIL, `합계 글자 수가 최대를 넘었습니다 (+${fmt(total - maximum)}자)`, detail), r)];
    if (total > recommended) return [Object.assign(item(WARN, `합계 글자 수가 권장을 넘었습니다 (+${fmt(total - recommended)}자)`, detail), r)];
    return [Object.assign(item(PASS, "합계 글자 수 정상", detail), r)];
  }

  function varField(lines, tag) {
    for (let k = 0; k < lines.length; k++) {
      const [no, line] = lines[k];
      const m = line.match(VAR_TAG);
      if (!m || strip(m[1]) !== tag) continue;
      const body = [m[2]];
      for (const [, nxt] of lines.slice(k + 1)) { if (startsWithAny(nxt.trimStart(), ["[", "#"])) break; body.push(nxt); }
      return [strip(body.join("\n")), no];
    }
    return null;
  }
  function varLines(lines, tag) {
    for (let k = 0; k < lines.length; k++) {
      const [no, line] = lines[k];
      const m = line.match(VAR_TAG);
      if (!m || strip(m[1]) !== tag) continue;
      const result = strip(m[2]) ? [[no, strip(m[2])]] : [];
      for (const [nno, nxt] of lines.slice(k + 1)) {
        if (startsWithAny(nxt.trimStart(), ["[", "#"])) break;
        if (strip(nxt)) result.push([nno, strip(nxt)]);
      }
      return result;
    }
    return [];
  }
  function checkVariables(sections, config) {
    const rule = config["변수_검사"];
    const limit = Math.trunc(Number(rule["변수_내용_최대"] ?? 200));
    const noSpace = Boolean(rule["변수_이름_공백_금지"] ?? true);
    let found = matchingSections(sections, ["변수"]);
    const exactFound = found.filter((s) => normalize(s.name) === normalize("변수"));
    if (exactFound.length) found = exactFound;
    if (!found.length) return [item(WARN, "'변수' 섹션을 찾지 못해 변수 검사를 건너뜁니다", "헤더를 '# 변수' 로 적어 주세요.")];
    const blocks = [];
    for (const sec of found) splitlines(sec.body).forEach((line, off) => {
      const m = line.match(VAR_TAG);
      if (m && strip(m[1]) === "변수 이름") blocks.push([]);
      if (blocks.length) blocks[blocks.length - 1].push([sec.start + off, line]);
    });
    if (!blocks.length) return [item(WARN, "'변수' 섹션에 [변수 이름] 블록이 없습니다", "각 변수는 '[변수 이름] 이름 / 텍스트' 줄로 시작해야 합니다.")];
    const items = [];
    let nameFail = 0, lenFail = 0, rowWarn = 0, longest = ["", 0];
    const kinds = { "텍스트": 0, "게이지": 0 };
    for (const block of blocks) {
      const [headNo, head] = block[0];
      const raw = strip(head.match(VAR_TAG)[2]);
      let [name, sep, kind] = rpartition(raw, "/");
      [name, kind] = sep ? [strip(name), strip(kind)] : [raw, ""];
      const label = name || "(이름 없음)";
      if (!(kind in kinds)) items.push(item(WARN, `변수 '${label}'의 종류를 알 수 없습니다`, `${headNo}번째 줄 — '이름 / 텍스트' 또는 '이름 / 게이지' 형식으로 적어 주세요.`));
      else kinds[kind]++;
      if (noSpace && /\s/.test(name)) { nameFail++; items.push(item(FAIL, `변수 이름 '${name}'에 공백이 있습니다`, `${headNo}번째 줄 — 공백 대신 밑줄(_)을 쓰거나 붙여 써 주세요.`)); }
      const tag = kind === "게이지" ? "값이 변하는 조건" : "변수 내용";
      const f = varField(block, tag);
      if (!f) items.push(item(WARN, `변수 '${label}'에 [${tag}] 칸이 없습니다`, `${headNo}번째 줄의 변수`));
      else {
        const [text, no] = f, n = len(text);
        if (n > longest[1]) longest = [label, n];
        if (n > limit) { lenFail++; items.push(item(FAIL, `변수 '${label}'의 [${tag}]이 ${fmt(n)}자입니다 (최대 ${fmt(limit)}자, +${fmt(n - limit)}자)`, `${no}번째 줄`)); }
      }
      for (const [no, row] of varLines(block, "구간별 행동")) {
        if (len(row) > limit) { rowWarn++; items.push(item(WARN, `변수 '${label}'의 [구간별 행동] 한 줄이 ${fmt(len(row))}자입니다 (기준 ${fmt(limit)}자)`, `${no}번째 줄 — ${Array.from(row).slice(0, 20).join("")}...`)); }
      }
    }
    const summary = `텍스트 ${kinds["텍스트"]}개 / 게이지 ${kinds["게이지"]}개`;
    const ok = [];
    if (noSpace && nameFail === 0) ok.push(item(PASS, `변수 이름에 공백이 없습니다 (${blocks.length}개)`, summary));
    if (lenFail === 0) ok.push(item(PASS, `변수 내용이 모두 ${fmt(limit)}자 이내입니다`, longest[0] ? `가장 긴 변수: '${longest[0]}' ${fmt(longest[1])}자` : ""));
    if (kinds["게이지"] && rowWarn === 0) ok.push(item(PASS, `[구간별 행동]의 모든 줄이 ${fmt(limit)}자 이내입니다`));
    return [...ok, ...items];
  }

  function templateHeaders(config, templateText) {
    if (!config["템플릿_파일"] || !(config["템플릿_헤더_필수"] ?? true) || !templateText) return [];
    return parseMdSections(templateText).map((s) => strip(s.name.replace(/\([^)]*\)/g, ""))).filter((n) => normalize(n));
  }
  function checkSections(res, config, templateText) {
    const items = [];
    if (!res.length) return [item(FAIL, "생성 결과에서 섹션 헤더를 하나도 찾지 못했습니다", "헤더는 '# 제목' 형태로 한 줄에 단독으로 적어 주세요.")];
    const required = [...(config["필수_섹션"] || []).map((n) => [n, "필수 섹션"]),
      ...templateHeaders(config, templateText).map((n) => [n, `템플릿(${config["템플릿_파일"]})`])];
    const seen = new Set();
    let missing = 0;
    for (const [name, source] of required) {
      if (seen.has(normalize(name))) continue;
      seen.add(normalize(name));
      if (!findSection(res, [name])) { missing++; items.push(item(FAIL, `'${name}' 섹션이 없습니다`, `기준: ${source}`)); }
    }
    if (required.length && missing === 0) items.push(item(PASS, `필수 섹션 ${seen.size}개가 모두 있습니다`, required.slice(0, 20).map(([n]) => n).join(", ")));
    if (config["원본_헤더_비교"] ?? true) items.push(item(INFO, "원본 설정에서 헤더를 찾지 못해 헤더 비교를 건너뜁니다"));
    return items;
  }

  /** PC판 run_mechanical_checks("", text, config) 와 같은 결과 */
  function runChecks(text, config, templateText) {
    if (!strip(text)) return [["기본 확인", [item(FAIL, "생성 결과 내용이 비어 있습니다", "검사할 생성 결과 파일을 먼저 불러와 주세요.")]]];
    const secs = parseMdSections(text);
    const groups = [
      ["글자 수 검사", checkLengths(secs, config)],
      ["{{user}} 위치 검사", checkUserVariable(text, secs, config)],
      ["필수 섹션 / 헤더 검사", checkSections(secs, config, templateText)],
    ];
    if (config["합계_제한"] && typeof config["합계_제한"] === "object") groups.push(["합계 글자 수 검사", checkTotalLength(secs, config)]);
    if (config["변수_검사"] && typeof config["변수_검사"] === "object") groups.push(["변수 검사", checkVariables(secs, config)]);
    return groups;
  }

  // ── 템플릿 양식 ──
  function headingKey(line) {
    let s = strip(line);
    if (!s || (startsWithAny(s, BULLETS) && !s.startsWith("#"))) return "";
    s = strip(s.replace(/^#+/, ""));
    const n = len(s);
    return n > 0 && n <= 60 ? normalize(s) : "";
  }
  const compact = (s) => s.replace(/\s/g, "");

  function parseTagBody(lines) {
    const values = {}, order = [], multi = new Set();
    let cur = null, buf = [], inline = "";
    const flush = () => {
      if (cur === null) return;
      if (!strip(inline) && buf.some((b) => strip(b))) multi.add(cur);
      values[cur] = strip([...(strip(inline) ? [strip(inline)] : []), ...buf].join("\n"));
    };
    for (const line of lines) {
      const m = line.match(VAR_TAG);
      if (m) { flush(); cur = strip(m[1]); inline = m[2]; buf = []; order.push(cur); }
      else if (cur !== null) buf.push(rstrip(line));
    }
    flush();
    return [values, order, multi];
  }

  function splitBlocks(lines, kind, groupTitles) {
    const groupKeys = new Map(groupTitles.map((g) => [normalize(g), g]));
    let heading = groupTitles[0] || "";
    const result = [];
    let head = null, body = [];
    const close = () => {
      if (!head) return;
      const [values, order, multi] = parseTagBody(body);
      let [group, name] = head;
      if (kind === "lore") group = heading;
      result.push([heading, { group, name, values }, order, multi]);
    };
    for (const line of lines) {
      const hk = headingKey(line);
      if (hk && groupKeys.has(hk) && !VAR_HEAD.test(line) && !LORE_HEAD.test(line)) {
        close(); head = null; body = []; heading = groupKeys.get(hk); continue;
      }
      const m = line.match(kind === "var" ? VAR_HEAD : LORE_HEAD);
      if (m) {
        close(); body = [];
        if (kind === "var") {
          const [name, sep, typ] = rpartition(strip(m[1]), "/");
          head = sep ? [strip(typ), strip(name)] : ["", strip(m[1])];
        } else head = ["", strip(m[2])];
        continue;
      }
      if (head) body.push(line);
    }
    close();
    return result;
  }

  function blockText(block, group, kind, number = 0) {
    const lines = [kind === "var"
      ? (block.group ? `[변수 이름] ${block.name} / ${block.group}` : `[변수 이름] ${block.name}`)
      : rstrip(`${number}. 트리거: ${block.name}`)];
    const tags = group ? [...group.tags] : [];
    for (const t of Object.keys(block.values)) if (!tags.includes(t)) tags.push(t);
    for (const tag of tags) {
      const value = block.values[tag] ?? "";
      if ((group && group.multiline.has(tag)) || value.includes("\n")) { lines.push(`[${tag}]`); if (value) lines.push(value); }
      else lines.push(rstrip(`[${tag}] ${value}`));
    }
    return lines;
  }

  function buildSchema(text) {
    const secs = parseMdSections(text);
    if (!secs.length) throw new Error("'# 제목' 으로 된 큰 항목이 없습니다.");
    const topLevel = Math.min(...secs.map((s) => s.level));
    const parts = [];
    for (const top of secs.filter((s) => s.level === topLevel)) {
      const inner = secs.filter((s) => s.level > topLevel && top.start <= s.start - 1 && s.start - 1 <= top.end);
      const childLevel = inner.length ? Math.min(...inner.map((s) => s.level)) : 0;
      const children = inner.filter((s) => s.level === childLevel);
      const bodyLines = splitlines(top.body);
      const nt = normalize(top.name);
      if (nt === normalize("변수") || nt === normalize("로어북")) {
        const kind = nt === normalize("변수") ? "var" : "lore";
        const titles = children.map((c) => c.name);
        const split = splitBlocks(bodyLines, kind, titles);
        const groups = new Map();
        for (const [heading, block, order, multi] of split) {
          const gkey = kind === "var" ? block.group : heading;
          let g = groups.get(gkey);
          if (!g) {
            g = { title: kind === "var" ? heading : gkey, kind: gkey, tags: [...order], multiline: new Set(multi), short: new Set(),
                  sample: blockText(block, null, kind, 1).join("\n") };
            groups.set(gkey, g);
          }
          multi.forEach((t) => g.multiline.add(t));
        }
        for (const g of groups.values())
          g.short = new Set(g.tags.filter((t) => !g.multiline.has(t)
            && split.filter(([, b]) => b.group === g.kind).every(([, b]) => len(b.values[t] ?? "") <= 30)));
        let ordered;
        if (kind === "lore") {
          for (const t of titles) if (!groups.has(t)) groups.set(t, { title: t, kind: t, tags: ["내용"], multiline: new Set(), short: new Set(), sample: "" });
          ordered = titles.map((t) => groups.get(t));
        } else ordered = [...groups.values()];
        parts.push({ title: top.name, kind, fields: [], groups: ordered, defaults: split.map(([, b]) => b) });
        continue;
      }
      const fields = [];
      const first = children.length ? children[0].start - 1 - top.start : bodyLines.length;
      const intro = stripNL(bodyLines.slice(0, first).join("\n"));
      if (strip(intro) || !children.length) fields.push({ part: top.name, title: "", guide: intro, subHeads: [] });
      for (const c of children) {
        const subs = splitlines(c.body).map((l) => l.match(MD_HEADER)).filter(Boolean).map((m) => strip(m[2]));
        fields.push({ part: top.name, title: c.name, guide: rstrip(stripNL(c.body)), subHeads: subs });
      }
      parts.push({ title: top.name, kind: "prose", fields, groups: [], defaults: [] });
    }

  const cloneBlock = (b) => ({ group: b.group, name: b.name, values: { ...b.values } });

    const out = [], owner = [];
    const add = (line, who) => { out.push(line); owner.push(who); };
    for (const part of schema.parts) {
      if (out.length) add("", part.title);
      add(`# ${part.title}`, part.title);
      if (part.kind === "prose") {
        for (const f of part.fields) {
          if (f.title) { add("", f.label); add(`## ${f.title}`, f.label); }
          const text = rstrip(stripNL(form.prose[f.key] ?? ""));
          for (const line of text ? splitlines(text) : []) add(line, f.label);
        }
        continue;
      }
      let number = 0;
      const blocks = form.blocks[part.title] || [];
      for (const g of part.groups) {
        add("", part.title); add(`## ${g.title}`, part.title);
        for (const b of blocks.filter((b) => groupOf(part, b) === g)) {
          number++;

          add("", who);

    const freeHeads = keys.some((k) => !k);
    keys = keys.filter(Boolean);
    if (!keys.length && !freeHeads) return text;
    return splitlines(text).map((line) => {
      const s = strip(line);
      if (s && !startsWithAny(s, ["#", ...BULLETS]) && len(s) <= 60) {

      }

  }

  function fillFromText(schema, text, config) {
    const form = defaultForm(schema);
    const partKeys = new Map();
    for (const p of schema.parts) for (const a of fieldAliases(p.title, config)) if (!partKeys.has(normalize(a))) partKeys.set(normalize(a), p);
    let cur = null, skipping = false, field = null;
    const seen = new Set(), buf = new Map(), raw = new Map(), unplaced = [], notes = [];
    for (const line of splitlines(text)) {
      const hk = headingKey(line);
      if (hk && partKeys.has(hk)) {
        cur = partKeys.get(hk);
        skipping = seen.has(cur.title);
        if (skipping) notes.push(`'${cur.title}' 항목이 두 번 이상 나옵니다. 한 벌만 다루므로 두 번째부터는 넣지 않았습니다.`);
        seen.add(cur.title);
        field = cur.fields.find((f) => !f.title) || null;
        continue;
      }
      if (!cur || skipping) { if (strip(line) && !strip(line).startsWith("※")) unplaced.push(line); continue; }
      if (cur.kind !== "prose") { if (!raw.has(cur.title)) raw.set(cur.title, []); raw.get(cur.title).push(line); continue; }
      const match = cur.fields.find((f) => f.title && hk && normalize(f.title) === hk);
      if (match) { field = match; if (!buf.has(field.key)) buf.set(field.key, []); continue; }
      if (!field) { if (strip(line)) unplaced.push(line); continue; }
      if (!buf.has(field.key)) buf.set(field.key, []);
      buf.get(field.key).push(line);
    }
    const filled = [];
    for (const p of schema.parts) {
      for (const f of p.fields) if (buf.has(f.key)) {

        filled.push(f.label);
      }
      if (p.kind !== "prose" && raw.has(p.title)) {

        if (blocks.length) { form.blocks[p.title] = blocks; filled.push(`${p.title} ${blocks.length}개`); }

  }

  function isPlaceholderLine(line, next) {
    let s = strip(line);
    s = strip(s.replace(/^#+/, ""));
    while (s && BULLETS.includes(s[0])) s = s.slice(1);
    s = strip(s);
    if (!s) return false;
    if (s.endsWith(":") && (next.startsWith(" ") || next.startsWith("\t"))) return false;
    return [":", "=", "!"].some((e) => s.endsWith(e)) || s.includes(": /") || s.includes("= /") || s.startsWith("(")

  function checkForm(schema, form, text, owner) {
    const items = [];
    const empty = [];
    for (const p of schema.parts) for (const f of p.fields) if (!strip(form.prose[f.key] ?? "")) empty.push(f.label);
    if (empty.length) items.push(item(WARN, `비어 있는 칸이 ${empty.length}개 있습니다`, empty.join(", ")));
    const lines = splitlines(text);
    const left = new Map();
    lines.forEach((line, i) => {
      const next = i + 1 < lines.length ? lines[i + 1] : "";
      if (schema.lines.has(strip(line)) && isPlaceholderLine(line, next)) {
        const who = owner[i] ?? "?";
        if (!left.has(who)) left.set(who, []);
        left.get(who).push(strip(line));
      }
    });
    if (left.size) {
      const total = [...left.values()].reduce((a, r) => a + r.length, 0);
      const detail = [...left].map(([who, rows]) => `· ${who}: ${Array.from(rows[0]).slice(0, 30).join("")}` + (rows.length > 1 ? ` 외 ${rows.length - 1}줄` : "")).join("\n");
      items.push(Object.assign(item(WARN, `아직 채우지 않은 템플릿 안내 문구가 ${total}줄 있습니다`, detail), { left }));
    }
    return items;
  }

  function labelLineNumbers(detail, owner) {
    return detail.replace(/((?:\d+, )*\d+)번째 줄/g, (m0, g1) => {
      const whos = [...new Set(g1.match(/\d+/g).map(Number).filter((n) => n > 0 && n <= owner.length).map((n) => owner[n - 1]))];
      return whos.length ? whos.map((w) => `'${w}'`).join(", ") + " 칸" : m0;
    });
  }

  return { PASS, WARN, FAIL, INFO, len, fmt, normalize, splitlines, parseMdSections, matchingSections, countChars, fieldAliases,
           runChecks, checkTotalLength, buildSchema, defaultForm, groupOf, assemble, buildSourceForm, fillFromText, checkForm,
           labelLineNumbers, blockText, MD_HEADER };
})();

<script>

              empty: new Set(), savedAt: null, saveOk: true, source: null };

  function loadRules() {
    const custom = store.get(RULES);

    const el = document.createElement(tag);

      if (v == null || v === false) continue;

  const now = () => new Date();
  const hhmm = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  const stamp = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}_${hhmm(d).replace(":", "")}`;

    for (const p of S.schema.parts) for (const f of p.fields) if (!f.title) {
      const m = (S.form.prose[f.key] || "").match(/\[([^\]\n]+?)\s+CHARACTER PROFILE\]/i);

  // ── 이동 대상 ──
  function targets() {
    const list = [];
    for (const p of S.schema.parts) {
      if (p.kind === "prose") p.fields.forEach((f) => list.push({ kind: "field", key: f.key, label: f.label, part: p.title }));
      else list.push({ kind: "blocks", part: p.title, label: p.title });
    }
    return list;
  }
  function targetOfOwner(who) {
    for (const p of S.schema.parts) {
      if (p.kind === "prose") {
        const f = p.fields.find((x) => x.label === who);
        if (f) return { kind: "field", key: f.key };
        if (who === p.title && p.fields[0]) return { kind: "field", key: p.fields[0].key };
      } else if (who === p.title || who.startsWith(p.title + " ") || (p.kind === "var" && who.startsWith("변수 "))) {

  }
  const sameTarget = (a, b) => a && b && a.kind === b.kind && (a.kind === "field" ? a.key === b.key : a.part === b.part);

  // ── 계산 ──

    const formItems = E.checkForm(S.schema, S.form, S.text, S.owner);

    for (const p of S.schema.parts) for (const f of p.fields) if (!(S.form.prose[f.key] || "").trim()) S.empty.add(f.label);
    S.issues = [...raw, ...formItems].map((i) => {

      if (i.left && t.kind === "field") continue;  // 남은 안내 문구는 아래에서 따로 셈
      if (i.status === E.FAIL) return "fail";

      const f = S.schema.parts.flatMap((p) => p.fields).find((x) => x.key === t.key);

  // ── 저장 ──

    if (S.saveOk) S.savedAt = now();

  function replaceForm(form, source, message) {

  }

  function renderDraftMeta() {

      h("span", { text: S.saveOk ? (S.savedAt ? `이 기기에 자동 저장됨 · ${hhmm(S.savedAt)}` : "이 기기에 자동 저장됩니다") : "자동 저장이 막혀 있습니다. 내보내기로 따로 보관하세요." }),
      h("span", { text: S.rules.custom ? "내가 바꾼 규칙 사용 중" : "기본 규칙 사용 중" }));
  }
  function renderNav() {
    const nav = $("nav");
    const name = charName();
    const kids = [
      h("div", { class: "draft" },
        h("p", { class: "draft-name", text: name || "이름 없는 캐릭터" }),
        h("div", { class: "draft-meta", id: "draft-meta" })),
      h("div", { class: "quick-home" },
        h("button", { class: "btn primary", type: "button", onclick: openPaste, text: "원자료 붙여넣기" }),
        h("button", { class: "btn", type: "button", onclick: () => $("file-source").click(), text: "파일 불러오기" }),
        h("button", { class: "btn", type: "button", onclick: openExport, text: "내보내기" })),
    ];
    for (const p of S.schema.parts) {
      const list = h("ul", { class: "items" });
      const add = (t, label, sub) => {
        const st = statusOf(t);
        list.append(h("li", {}, h("button", { class: "nav-item", type: "button", "aria-current": sameTarget(S.view, t) ? "true" : "false",
          onclick: () => go(t) },

          h("span", { class: "name" }, label, h("span", { class: "sub", text: sub })),

        add(t, f.label, sub);

        list.lastChild.querySelector(".tnum").textContent = `${n}개`;

        f.guide ? h("details", { class: "guide" }, h("summary", { text: "템플릿 안내 보기" }), h("pre", { text: f.guide })) : null,

  function blockCard(part, g, b, limit) {
    const blocks = S.form.blocks[part.title];
    const bi = String(blocks.indexOf(b));
    const nameInput = h("input", { class: "input", id: `blk-${part.title}-${bi}-name`, value: b.name, "data-block": bi,
      placeholder: part.kind === "var" ? "공백 없이 (예: 최근사건)" : "예: !요약",
      oninput: () => { b.name = nameInput.value.trim(); changed(); } });

  // ── 아래 계기판 ──
  function renderMeters() {
    const cfg = S.rules.config, secs = E.parseMdSections(S.text), ratio = Number(cfg["경고_비율"] ?? 0.9);
    const meters = [];
    for (const rule of cfg["글자수_제한"] || []) {
      const field = rule["필드"] ?? "?", limit = Math.trunc(Number(rule["최대"] ?? 0));
      const n = E.matchingSections(secs, [field, ...(rule["별칭"] || [])]).reduce((a, s) => a + E.countChars(s.body, true), 0);
      meters.push({ label: field, n, max: limit, state: n > limit ? "fail" : n > limit * ratio ? "warn" : "" });
    }
    if (cfg["합계_제한"] && typeof cfg["합계_제한"] === "object") {
      const t = E.checkTotalLength(secs, cfg)[0];
      meters.push({ label: "합계", n: t.total, max: t.maximum, mark: t.recommended, state: t.status === E.FAIL ? "fail" : t.status === E.WARN ? "warn" : "" });
    }
    $("meters").replaceChildren(...meters.slice(0, 3).map((m) => h("div", { class: `meter ${m.state}` },
      h("div", { class: "meter-label" }, h("span", { text: m.label }),
        h("span", { class: "tnum" }, h("b", { text: fmt(m.n) }), h("small", { text: "/" + fmt(m.mark || m.max) }))),
      h("div", { class: "meter-track", role: "meter", "aria-label": m.label, "aria-valuemin": "0", "aria-valuemax": String(m.max), "aria-valuenow": String(m.n) },
        h("div", { class: "meter-fill", style: `width:${Math.min(100, (m.n / Math.max(1, m.mark || m.max)) * 100)}%` })))));
    const fails = S.issues.filter((i) => i.status === E.FAIL).length, warns = S.issues.length - fails;
    const btn = $("issues-btn");
    btn.className = "issues-btn " + (fails ? "fail" : warns ? "warn" : "ok");
    btn.textContent = fails ? `점검 ✕${fails} ▲${warns}` : warns ? `점검 ▲${warns}` : "점검 ✓";
  }

    const s = sheet(h("h2", { text: "실시간 점검" }),
      h("p", { class: "muted", text: "PC판 기계 검사와 같은 기준입니다. 쓰는 동안 자동으로 갱신됩니다." }),
      ...(items.length ? items : [h("p", { text: "✓ 걸린 것이 없습니다. 내보내서 검수를 맡겨 보세요." })]),
      h("button", { class: "btn", type: "button", text: "닫기", onclick: () => s.close() }));
  }

  // ── 시작 ──
  $("menu-btn").addEventListener("click", openMenu);
  $("back-btn").addEventListener("click", () => go({ kind: "home" }));
  $("issues-btn").addEventListener("click", openIssues);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("layer").replaceChildren(); });
  // 휴대폰 키보드가 화면을 가리고 있을 때만 아래 계기판을 잠시 숨깁니다
  const typingTarget = (el) => el && (el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && el.type !== "file")) && !el.closest(".sheet");
  const updTyping = () => {
    const vv = window.visualViewport;
    const keyboard = vv ? vv.height < window.innerHeight * 0.8 : true;
    document.body.classList.toggle("typing", typingTarget(document.activeElement) && keyboard && matchMedia("(max-width: 899px)").matches);
  };
  document.addEventListener("focusin", updTyping);
  document.addEventListener("focusout", () => setTimeout(updTyping, 0));
  window.visualViewport?.addEventListener("resize", updTyping);

  try {
    loadRules();
  } catch {
    store.del(RULES);
    loadRules();
  }
  const saved = store.get(STORE);
  if (saved && validForm(saved.form)) {
    S.form = E.defaultForm(S.schema);
    Object.assign(S.form.prose, saved.form.prose);
    for (const k of Object.keys(S.form.blocks)) if (Array.isArray(saved.form.blocks[k])) S.form.blocks[k] = saved.form.blocks[k];
    S.source = saved.source || null;
    S.savedAt = saved.savedAt ? new Date(saved.savedAt) : null;
  } else {
    S.form = E.defaultForm(S.schema);
  }
  recompute();
  go({ kind: "home" });
})();
</script>

</body>
</html>
